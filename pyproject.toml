[project]
name = "cgel"
version = "0.0.0"
description = "CGELBank: a human-annotated treebank of English using the CGEL formalism."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-4.0" }

# Repo-level scripts (eval, analysis, convertor UI, figures, all-examples).
# The tree library, converters and validator come from the local package.
dependencies = [
    "cgel-json-converter",
    "tqdm",
    "levenshtein>=0.20.9",
    "pandas>=2.2.2",
    "tabulate>=0.9.0",
    "udapi>=0.3.0",
    "nltk",
    "pyyaml",
    "beautifulsoup4",
    "lxml",
    "mammoth",
    "more-itertools",
    "python-docx",
    "pypdf",
    "flask",
    "plotnine",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.uv.sources]
cgel-json-converter = { path = "packages/cgel-json-converter", editable = true }

[tool.pytest.ini_options]
testpaths = ["test", "packages/cgel-json-converter/tests"]
